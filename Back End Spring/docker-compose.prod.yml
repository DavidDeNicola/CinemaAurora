services:
  cinema-frontend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8081:80"
    volumes:
      - "../Front End Angular/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro"

  cinema-backend:
    restart: unless-stopped
    ports: !reset []
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

  mysql-cinema:
    restart: unless-stopped
    ports: !reset []
    command: --performance-schema=OFF --innodb-buffer-pool-size=64M --max-connections=30