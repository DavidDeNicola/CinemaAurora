name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Back End Spring"

    env:
      SPRING_PROFILES_ACTIVE: h2
      SMTP_EMAIL: test@test.it
      SMTP_PASSWORD: test

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'Back End Spring/pom.xml'

      - name: Genera una chiave JWT di test
        run: echo "JWT_KEY=$(openssl rand -hex 64)" >> "$GITHUB_ENV"

      - name: Esegui i test
        run: mvn -B test