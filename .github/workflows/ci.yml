name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Back End Spring"

    env:
      SPRING_PROFILES_ACTIVE: h2
      SMTP_EMAIL: test@test.it
      SMTP_PASSWORD: test

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Installa Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'Back End Spring/pom.xml'

      - name: Genera una chiave JWT di test
        run: echo "JWT_KEY=$(openssl rand -hex 64)" >> "$GITHUB_ENV"

      - name: Esegui i test
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: mvn -B test

  deploy:
    name: Deploy su EC2
    needs: backend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-produzione

    steps:
      - name: Aggiorna il server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/CinemaAurora
            git pull origin main
            cd "Back End Spring"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f