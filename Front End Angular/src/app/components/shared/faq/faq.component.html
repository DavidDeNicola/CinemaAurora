<section class="py-5">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="mb-3">
                <span class="badge bg-primary text-uppercase px-3 py-2">FAQ</span>
            </h2>
            <h2 class="fw-bold">Domande frequenti</h2>
            <p class="text-muted">Trova rapidamente le risposte alle domande più comuni</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="accordion shadow" id="faqAccordion">
                    @for(faq of faqList; track faq.id;) {
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#faq-' + faq.id">
                                    {{ faq.domanda }}
                                </button>
                            </h2>
                            <div [id]="'faq-' + faq.id" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                                <div class="accordion-body text-muted">
                                    {{ faq.risposta }}
                                </div>
                            </div>
                        </div>
                    }
                </div>
            </div>
        </div>
    </div>
</section>
