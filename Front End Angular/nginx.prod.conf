server {
    listen 80;
    server_name _;
    return 301 https://cinema-aurora.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name cinema-aurora.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/cinema-aurora.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinema-aurora.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /backend/ {
        proxy_pass http://cinema-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}